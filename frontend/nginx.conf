# One worker process is enough for our small learning project.
worker_processes 1;

# These events are the basic Nginx connection settings.
events {
    worker_connections 1024;
}

http {
    # Load Nginx's list of file types, such as CSS and JavaScript.
    include /etc/nginx/mime.types;

    # Use a safe default type if Nginx does not recognise a file type.
    default_type application/octet-stream;

    server {
        # Nginx listens on port 80 inside its own container.
        listen 80;

        # The website files copied by our Dockerfile live in this folder.
        root /usr/share/nginx/html;

        # Open index.html when somebody visits the main address.
        index index.html;

        # For normal requests, give the browser our frontend files.
        location / {
            try_files $uri $uri/ =404;
        }

        # For API requests, forward the request to the backend container.
        location /api/ {
            # "backend" works because it is the backend service name in docker-compose.yml.
            proxy_pass http://backend:8000;

            # Pass the original host name and visitor address to the backend.
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
